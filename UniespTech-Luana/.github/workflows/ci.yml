name: CI - LuanaJessica

on:
  push:
    branches: [ "LuanaJessica" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e Testes
        run: mvn clean verify

      - name: Build Docker
        run: docker build -t uniesp-tech:${{ github.sha }} .

      - name: Exportar imagem
        run: docker save uniesp-tech:${{ github.sha }} -o uniesp-tech.tar

      - name: Upload da imagem Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: uniesp-tech.tar

      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar