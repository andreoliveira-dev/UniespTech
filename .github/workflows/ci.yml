name: CI Pipeline

on:
  push:
    branches:
      - "main"
      - "feat-*"
      - "feat/*"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uniesp_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build e Testes com Maven
        env:
          DB_URL: jdbc:postgresql://localhost:5432/uniesp_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: mvn clean package

      - name: Upload do artefato jar
        uses: actions/upload-artifact@v4
        with:
          name: uniesp-tech-jar
          path: target/uniesp-tech.jar