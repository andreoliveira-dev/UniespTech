name: Baroes da pisadinha so passa musica boa (Java CI Professional)

on:
  push:
    # Dispara na minha branch fui atras pq sou cagona
    branches: [ "feat/Franciellyariel" ]
  pull_request:
    branches: [ "feat/Franciellyariel" ]

jobs:
  # teste unitariuss
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22 (GraalVM)
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'graalvm'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile

      - name: Run Unit Tests
        run: mvn test

      # relatorio dos baroes da pisadinha
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

  # segurança , preciso estudar direitinho n entendi tudo
  security-check:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Check (OWASP)
        # lebrar isso aqui roda verification
        run: mvn org.owasp:dependency-check-maven:check

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  # configurationis de docker
  containerize:
    needs: [security-check]
    # só roda pra mia branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/Franciellyariel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest