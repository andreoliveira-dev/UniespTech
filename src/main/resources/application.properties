spring.application.name=Projeto Uniesp Tech

# Configuracao do Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5432/UniespTech
spring.datasource.username=postgres
spring.datasource.password=manudb
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: Cria/Atualiza as tabelas com base nas suas Entidades Java
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracao do Pool de Conexoes (opcional, melhora desempenho)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Logging SQL (opcional, util para debug)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info