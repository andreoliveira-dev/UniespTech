name: Docker

on:
  push:
    branches: [ "feat/caioSousa" ]

jobs:
  build-e-testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:

      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e rodar testes
        run: mvn verify --no-transfer-progress

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/

  build-docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    # Só gera a imagem se os testes passarem
    needs: build-e-testes

    steps:

      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar metadata da imagem (nome + tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/uniesp-tech
          # Tag com o hash curto do commit: ex. sha-a1b2c3d
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}