version: '3.8'

services:

  db:
    image: postgres:16
    container_name: uniesp_db
    environment:
      POSTGRES_DB: uniesp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: uniesp_app
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/uniesp_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    stdin_open: true
    tty: true