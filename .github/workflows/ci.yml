name: Baroes da pisadinha - Java CI CD

on:
  push:

    branches: [ "feat/Franciellyariel" ]
  pull_request:
    branches: [ "feat/Franciellyariel" ]

env:

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up JDK 22 (GraalVM)
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'graalvm'
          cache: maven

      - name: Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean compile

      - name: Run Unit Tests
        run: ./mvnw test

  containerize:
    needs: [build-and-test]

    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/uniesptech:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/uniesptech:${{ github.actor }}-latest