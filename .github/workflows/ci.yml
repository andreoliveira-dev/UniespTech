name: CI - LuanaJessica

on:
  push:
    branches: [ "LuanaJessica" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e executar testes
        run: mvn -B clean verify --no-transfer-progress

      - name: Build Docker
        run: docker build . -t uniesp-tech:${{ github.sha }}

      - name: Exportar imagem Docker
        run: docker save uniesp-tech:${{ github.sha }} -o uniesp-tech-${{ github.sha }}.tar

      - name: Upload da imagem Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: uniesp-tech-${{ github.sha }}.tar

      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ github.sha }}
          path: target/*.jar
