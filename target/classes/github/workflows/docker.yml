name: Docker

on:
  push:
    branches: [ "feat/caioSousa" ]
  pull_request:
    branches: [ "feat/caioSousa" ]

jobs:
  build-e-testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:

      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e rodar testes
        run: mvn verify --no-transfer-progress

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/

  build-docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build-e-testes

    steps:

      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar metadata da imagem (nome + tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/uniesp-tech
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/uniesp-tech:latest
          cache-to: type=inline

          publicar-jar:
            name: Artefato JAR
            runs-on: ubuntu-latest
            needs: build-e-testes //só começa se o job de testes passar, evitando gerar um JAR quebrado

            steps:

              - name: Clonar repositório
                uses: actions/checkout@v4

              - name: Configurar Java 21
                uses: actions/setup-java@v4
                with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: maven

              - name: Gerar versão com hash do commit
                id: versao
                run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

              - name: Compilar e empacotar JAR
                run: mvn package -DskipTests --no-transfer-progress

              - name: Renomear JAR com versão do commit
                run: mv target/*.jar target/uniesp-tech-${{ steps.versao.outputs.sha }}.jar

              - name: Publicar JAR como artifact no GitHub
                uses: actions/upload-artifact@v4
                with:
                  name: uniesp-tech-${{ steps.versao.outputs.sha }}
                  path: target/uniesp-tech-${{ steps.versao.outputs.sha }}.jar
                  retention-days: 30