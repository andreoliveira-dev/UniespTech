name: Baroes da pisadinha - Java CI CD

on:
  push:
    branches: [ "main", "feat/Franciellyariel" ]
  pull_request:
    branches: [ "main", "feat/Franciellyariel" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22 (GraalVM)
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'graalvm'
          cache: maven


      - name: Permission for Maven Wrapper
        run: chmod +x UniespTech/mvnw


      - name: Build with Maven
        run: ./mvnw clean compile
        working-directory: ./UniespTech

      - name: Run Unit Tests
        run: ./mvnw test
        working-directory: ./UniespTech

  containerize:
    needs: [build-and-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:

          context: ./UniespTech
          file: ./UniespTech/Dockerfile
          push: true
          tags: ghcr.io/andreoliveira-dev/uniesptech:latest