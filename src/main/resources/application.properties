spring.datasource.url=jdbc:h2:file:./data/uniesp_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Cria/Atualiza as tabelas automaticamente contemplem o mago
# if a criança abaixo chorar troca por validate ou none peguei isso dum outro codigo que tinha no pc que tinha brecadi mas ajeitei assim
spring.jpa.hibernate.ddl-auto=update


# coisinha do h2 acessa em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

#Coisinha do fly
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true